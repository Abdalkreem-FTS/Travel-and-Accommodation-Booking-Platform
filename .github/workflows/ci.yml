name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HotelBooking.slnx

      - name: Verify formatting
        run: dotnet format HotelBooking.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HotelBooking.slnx --configuration Release --no-restore -warnaserror

      - name: Domain unit tests
        run: ./tests/HotelBooking.Domain.UnitTests/bin/Release/net10.0/HotelBooking.Domain.UnitTests

      - name: Application unit tests
        run: ./tests/HotelBooking.Application.UnitTests/bin/Release/net10.0/HotelBooking.Application.UnitTests

      - name: Architecture tests
        run: ./tests/HotelBooking.Architecture.Tests/bin/Release/net10.0/HotelBooking.Architecture.Tests

      - name: Integration tests
        run: ./tests/HotelBooking.Api.IntegrationTests/bin/Release/net10.0/HotelBooking.Api.IntegrationTests

  image:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - image: hotelbooking-api
            dockerfile: src/HotelBooking.Api/Dockerfile
          - image: hotelbooking-worker
            dockerfile: src/HotelBooking.Workers/Dockerfile
          - image: hotelbooking-gateway
            dockerfile: src/HotelBooking.Gateway/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
