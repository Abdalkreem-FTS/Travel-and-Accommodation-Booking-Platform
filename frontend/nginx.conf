server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts a content hash in every file name under /assets, so a changed
    # file always gets a new name and these can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path (e.g. /bookings/123) that is not a real file gets
    # index.html, so React Router can decide which page to show.
    # index.html itself is never cached, so a new build is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
