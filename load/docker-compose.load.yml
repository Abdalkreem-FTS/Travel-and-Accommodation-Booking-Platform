services:
  api-1: &fake-payments
    environment:
      Payments__Provider: Fake
  api-2: *fake-payments
  api-3: *fake-payments
  worker: *fake-payments

  gateway:
    environment:
      RateLimits__Global__Permit: "1000000"
      RateLimits__Auth__Permit: "1000000"

  k6:
    image: grafana/k6:2.3.0
    container_name: hotelbooking-k6
    profiles: ["load"]
    entrypoint: ["k6"]
    working_dir: /load
    environment:
      BASE_URL: http://gateway:8080
    volumes: ["./load:/load:ro"]
    depends_on:
      gateway: { condition: service_healthy }
