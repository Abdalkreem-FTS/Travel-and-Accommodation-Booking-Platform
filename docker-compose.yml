name: hotelbooking

x-api: &api
  build:
    context: .
    dockerfile: src/HotelBooking.Api/Dockerfile
  image: hotelbooking-api:local
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: 8080
    ConnectionStrings__Database: "Server=sqlserver,1433;Database=HotelBooking;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
    ConnectionStrings__Redis: redis:6379
    Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
    ForwardedHeaders__GatewayAddress: 172.30.0.250
    Payments__Fake__WebhookSecret: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
    Payments__Provider: ${PAYMENT_PROVIDER:-Fake}
    Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
    Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  depends_on:
    sqlserver: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s

services:

  api-1:
    <<: *api
    hostname: api-1
    container_name: hotelbooking-api-1

  api-2:
    <<: *api
    hostname: api-2
    container_name: hotelbooking-api-2
    depends_on:
      api-1: { condition: service_healthy }

  api-3:
    <<: *api
    hostname: api-3
    container_name: hotelbooking-api-3
    depends_on:
      api-1: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: src/HotelBooking.Gateway/Dockerfile
    image: hotelbooking-gateway:local
    container_name: hotelbooking-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Gateway__ExposeUpstream: "true"
      ReverseProxy__Clusters__api__Destinations__api-1__Address: http://api-1:8080
      ReverseProxy__Clusters__api__Destinations__api-2__Address: http://api-2:8080
      ReverseProxy__Clusters__api__Destinations__api-3__Address: http://api-3:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8080:8080"]
    networks:
      default: { ipv4_address: 172.30.0.250 }
    depends_on:
      otel-collector: { condition: service_started }
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
      api-3: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: src/HotelBooking.Workers/Dockerfile
    image: hotelbooking-worker:local
    deploy:
      replicas: 2
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=HotelBooking;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
      ConnectionStrings__Redis: redis:6379
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: 1025
      Email__Smtp__FromAddress: reservations@hotelbooking.local
      Payments__Provider: ${PAYMENT_PROVIDER:-Fake}
      Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      api-1: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    container_name: hotelbooking-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: ["sqlserver-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:8.2-alpine
    container_name: hotelbooking-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: hotelbooking-mailpit
    ports:
      - "1025:1025"    # SMTP ... Email:Smtp:Host/Port in appsettings.Development.json
      - "8025:8025"    # UI, where the confirmation the outbox handler sent can be read
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    container_name: hotelbooking-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports:
      - "4317:4317"    # OTLP/gRPC
      - "4318:4318"    # OTLP/HTTP
      - "8889:8889"    # /metrics ... scraped by Prometheus
    depends_on: [jaeger, seq]

  jaeger:
    image: jaegertracing/jaeger:2.12.0
    container_name: hotelbooking-jaeger
    ports:
      - "16686:16686"  # UI
      # 4317/4318 stay on the compose network only; the collector is the single OTLP front door

  seq:
    image: datalust/seq:2025.2
    container_name: hotelbooking-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"      # UI
      # Ingestion stays on the compose network: the collector posts to http://seq:5341/ingest/otlp
    volumes: ["seq-data:/data"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: hotelbooking-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [otel-collector]

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
  prometheus-data:
